<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sixteen — Step Sequencer</title>
<style>
    :root {
        --bg-color:     #1a1a1a;
        --pad-bg:       #2a2a2a;
        --accent:       #e53935;
        --text-color:   #888;
        --step-bg:      #333;
        --step-active:  #e53935;
        --step-current: #fff;
        --panel:        #222;
        --panel-edge:   #333;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background-color: var(--bg-color); }
    body {
        margin: 0; padding: 20px 14px 48px;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .machine {
        max-width: 430px;
        margin: 0 auto;
    }

    /* ---- header ---- */
    .brand {
        display: flex; align-items: baseline; gap: 10px;
        margin-bottom: 20px;
    }
    .brand h1 {
        margin: 0; font-size: 20px; font-weight: 500;
        color: var(--accent); letter-spacing: 1px;
    }
    .brand .sub {
        font-size: 12px; color: #666; font-weight: normal;
    }

    /* ---- transport ---- */
    .transport {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 16px;
    }
    .play-btn {
        background-color: var(--pad-bg);
        color: var(--accent);
        border: 1px solid #444;
        border-radius: 12px;
        width: 60px; height: 48px;
        font-size: 18px; cursor: pointer; font-weight: bold;
        display: grid; place-items: center;
    }
    .play-btn:active { background-color: #444; }
    .play-btn.playing { color: var(--accent); }

    .tempo {
        flex: 1;
        background-color: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        padding: 8px 14px;
    }
    .tempo .top { display: flex; justify-content: space-between; align-items: baseline; }
    .tempo label { font-size: 9px; letter-spacing: 1px; color: #aaa; font-weight: bold; text-transform: uppercase; }
    .tempo .val { font-size: 18px; color: #ccc; font-weight: bold; font-variant-numeric: tabular-nums; }
    .tempo .val small { font-size: 10px; color: #666; font-weight: normal; }
    input[type=range] {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 4px; border-radius: 2px; margin-top: 8px;
        background: #444; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 16px; height: 16px; border-radius: 50%;
        background: var(--accent); cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
        width: 16px; height: 16px; border-radius: 50%;
        background: var(--accent); cursor: pointer; border: none;
    }
    .clear-btn {
        background-color: var(--pad-bg);
        border: 1px solid #444;
        color: var(--text-color);
        border-radius: 12px; padding: 0 16px; height: 48px;
        font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
        font-weight: bold; cursor: pointer;
    }
    .clear-btn:active { background-color: #444; }

    /* ---- presets ---- */
    .presets {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        margin-bottom: 20px;
    }
    .preset {
        position: relative;
        background-color: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 10px; padding: 10px 8px 9px;
        cursor: pointer; text-align: left;
    }
    .preset .n { font-size: 8px; letter-spacing: 1px; color: #666; font-weight: bold; text-transform: uppercase; }
    .preset .nm { font-size: 12px; font-weight: bold; color: #aaa; margin-top: 3px; }
    .preset .lamp {
        position: absolute; top: 9px; right: 9px;
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--step-bg); border: 1px solid #1a1a1a;
    }
    .preset.active { border-color: var(--accent); }
    .preset.active .nm { color: var(--accent); }
    .preset.active .lamp { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .preset.cued .lamp { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink .5s steps(1) infinite; }
    .preset.cued { border-color: #7a2420; }
    @keyframes blink { 50% { opacity: .2; } }
    .preset .cue-txt {
        display: none; font-size: 8px; letter-spacing: 1px; color: var(--accent);
        text-transform: uppercase; margin-top: 5px; font-weight: bold;
    }
    .preset.cued .cue-txt { display: block; }

    /* ---- grid ---- */
    .beatbar { display: flex; align-items: center; margin-bottom: 6px; }
    .beatbar .spacer { width: 62px; flex-shrink: 0; }
    .beatbar .nums { display: flex; flex: 1; }
    .beatbar .nums span {
        flex: 1; margin: 0 1px; text-align: center;
        font-size: 8px; color: #666; font-variant-numeric: tabular-nums;
    }
    .beatbar .nums span:nth-child(4n+1) { color: var(--accent); }

    .grid { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; }
    .row .name {
        width: 62px; flex-shrink: 0;
        font-size: 11px; color: #aaa; text-align: right;
        padding-right: 8px; font-weight: bold;
    }
    .steps { display: flex; flex: 1; }
    .step {
        flex: 1; height: 26px;
        background-color: var(--step-bg);
        border-radius: 3px; margin: 0 1px; min-width: 2px;
        cursor: pointer;
        transition: background-color .1s, opacity .1s;
    }
    .step.on { background-color: var(--step-active); }
    .step.play { background-color: var(--step-current) !important; box-shadow: 0 0 10px #fff; }
    /* faint marker on the downbeat columns */
    .steps .step:nth-child(4n+1):not(.on):not(.play) { background-color: #3c3c3c; }

    .foot {
        margin-top: 20px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 11px; color: #666;
        display: flex; justify-content: space-between; align-items: center;
    }
    .foot .status b { color: var(--accent); }
    .foot .status .cue { color: var(--accent); }

    @media (max-width: 460px) {
        .row .name, .beatbar .spacer { width: 46px; }
        .step { height: 24px; }
    }
</style>
</head>
<body>
<div class="machine">
    <div class="brand">
        <h1>Sixteen</h1>
        <span class="sub">Step Sequencer <span class="version" style="font-size:12px;color:#666;">v1</span></span>
    </div>

    <div class="transport">
        <button class="play-btn" id="playBtn" title="Play / Stop">▶</button>
        <div class="tempo">
            <div class="top">
                <label>Tempo</label>
                <span class="val"><span id="bpmVal">120</span> <small>BPM</small></span>
            </div>
            <input type="range" id="bpm" min="60" max="220" value="120">
        </div>
        <button class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <div class="presets" id="presets"></div>

    <div class="beatbar">
        <div class="spacer"></div>
        <div class="nums" id="beatNums"></div>
    </div>
    <div class="grid" id="grid"></div>

    <div class="foot">
        <div class="status">Preset <b id="curName">—</b><span class="cue" id="cueNote"></span></div>
        <div id="wavNote">samples: checking…</div>
    </div>
</div>

<script>
/* ============================================================
   Sixteen — a 16-step drum sequencer.
   Uses the same samples as the groove generator:
   kick.wav, snare.wav, snare_ghost.wav, hihat_closed.wav,
   hihat_open.wav, crash.wav  (synth fallback if missing).
   Four presets; selecting a new one while playing CUES it and
   the switch happens when the current 16-step sequence loops.
   ============================================================ */

    const STEPS = 16;

    // Instrument rows, top → bottom. `key` maps to the sample/synth voice.
    const ROWS = [
        { key: 'crash',        name: 'Crash' },
        { key: 'hihat_open',   name: 'Open HH' },
        { key: 'hihat_closed', name: 'Closed HH' },
        { key: 'snare',        name: 'Snare' },
        { key: 'snare_ghost',  name: 'Ghost' },
        { key: 'kick',         name: 'Kick' },
    ];

    // ---- Four presets. Each is { name, pattern: { rowKey: [16 bits] } } ----
    // 1 = hit. Rows omitted default to empty.
    const P = (s) => s.split('').map(c => c === 'x' ? 1 : 0);
    const PRESETS = [
        {
            name: 'Four/Floor',
            pattern: {
                kick:         P('x...x...x...x...'),
                snare:        P('....x.......x...'),
                hihat_closed: P('x.x.x.x.x.x.x.x.'),
                hihat_open:   P('..x...x...x...x.'),
                crash:        P('x...............'),
            }
        },
        {
            name: 'Backbeat',
            pattern: {
                kick:         P('x.....x.x.......'),
                snare:        P('....x.......x...'),
                snare_ghost:  P('..x...x...x...x.'),
                hihat_closed: P('x.x.x.x.x.x.x.x.'),
            }
        },
        {
            name: 'Half-Time',
            pattern: {
                kick:         P('x.......x.x.....'),
                snare:        P('........x.......'),
                hihat_closed: P('x...x...x...x...'),
                crash:        P('x.......x.......'),
            }
        },
        {
            name: 'D-Beat',
            pattern: {
                kick:         P('x...x...x...x...'),
                snare:        P('..x...x...x...x.'),
                hihat_closed: P('x.x.x.x.x.x.x.x.'),
                crash:        P('x...............'),
            }
        },
    ];

    // ---------- audio (same loading + fallback as the groove app) ----------
    let audioCtx;
    const wavBuffers = {};
    const wavFiles = {
        kick: 'kick.wav', snare: 'snare.wav', snare_ghost: 'snare_ghost.wav',
        hihat_closed: 'hihat_closed.wav', hihat_open: 'hihat_open.wav', crash: 'crash.wav',
    };

    async function loadWavBuffers() {
        let loaded = 0;
        for (const [key, file] of Object.entries(wavFiles)) {
            try {
                const res = await fetch(file);
                if (!res.ok) continue;
                const buf = await res.arrayBuffer();
                wavBuffers[key] = await audioCtx.decodeAudioData(buf);
                loaded++;
            } catch (e) { /* fall back to synth */ }
        }
        const note = document.getElementById('wavNote');
        note.textContent = loaded > 0
            ? `samples: ${loaded}/6 loaded`
            : 'samples: none found — using synth';
    }

    async function initAudio() {
        if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
            await loadWavBuffers();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playWav(key, vol, time) {
        if (!wavBuffers[key]) return false;
        const src = audioCtx.createBufferSource();
        src.buffer = wavBuffers[key];
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(Math.min(1, vol), time);
        src.connect(g); g.connect(audioCtx.destination);
        src.start(time);
        return true;
    }

    // Synth fallback voices (mirrors the groove app so it sounds the same w/o wavs)
    function playSynth(key, vol, time) {
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(vol, time);
        g.connect(audioCtx.destination);
        if (key === 'kick') {
            const o = audioCtx.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(250, time);
            o.frequency.exponentialRampToValueAtTime(0.001, time + 0.2);
            g.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
            o.connect(g); o.start(time); o.stop(time + 0.2);
        } else if (key === 'snare' || key === 'snare_ghost') {
            const o = audioCtx.createOscillator();
            o.type = 'triangle'; o.frequency.setValueAtTime(200, time);
            const noise = audioCtx.createBufferSource();
            const b = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.25, audioCtx.sampleRate);
            const d = b.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            noise.buffer = b;
            const f = audioCtx.createBiquadFilter();
            f.type = 'highpass'; f.frequency.value = 1000;
            noise.connect(f); f.connect(g); o.connect(g);
            g.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
            o.start(time); noise.start(time); o.stop(time + 0.25);
        } else {
            // cymbals / hats
            const isCrash = key === 'crash';
            const isOpen = key === 'hihat_open';
            const dur = isCrash ? 1.5 : (isOpen ? 0.4 : 0.08);
            const noise = audioCtx.createBufferSource();
            const b = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
            const d = b.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            noise.buffer = b;
            const f = audioCtx.createBiquadFilter();
            f.type = 'highpass'; f.frequency.value = isCrash ? 4000 : (isOpen ? 5000 : 7000);
            noise.connect(f); f.connect(g);
            g.gain.exponentialRampToValueAtTime(0.001, time + dur);
            noise.start(time);
        }
    }

    function trigger(key, time) {
        const vol = key === 'snare_ghost' ? 0.32 : 0.9;
        if (!playWav(key, vol, time)) playSynth(key, vol, time);
    }

    // ---------- pattern state ----------
    // live grid: { rowKey: [16] }
    let grid = {};
    function emptyGrid() {
        const g = {};
        ROWS.forEach(r => g[r.key] = new Array(STEPS).fill(0));
        return g;
    }
    function loadPreset(idx) {
        grid = emptyGrid();
        const pat = PRESETS[idx].pattern;
        for (const key in pat) if (grid[key]) grid[key] = pat[key].slice();
        currentPreset = idx;
        cuedPreset = null;
        renderCells();
        renderPresets();
        document.getElementById('curName').textContent = PRESETS[idx].name;
        document.getElementById('cueNote').textContent = '';
    }

    let currentPreset = 0;
    let cuedPreset = null;   // set when a new preset is chosen mid-play

    // ---------- build DOM ----------
    const gridEl = document.getElementById('grid');
    const cellEls = {}; // rowKey -> [16 elements]

    function buildGrid() {
        ROWS.forEach(r => {
            const row = document.createElement('div');
            row.className = 'row';
            const name = document.createElement('div');
            name.className = 'name'; name.textContent = r.name;
            const steps = document.createElement('div');
            steps.className = 'steps';
            cellEls[r.key] = [];
            for (let i = 0; i < STEPS; i++) {
                const c = document.createElement('div');
                c.className = 'step';
                c.addEventListener('click', () => {
                    grid[r.key][i] = grid[r.key][i] ? 0 : 1;
                    c.classList.toggle('on', !!grid[r.key][i]);
                });
                steps.appendChild(c);
                cellEls[r.key].push(c);
            }
            row.appendChild(name); row.appendChild(steps);
            gridEl.appendChild(row);
        });
        // beat numbers
        const nums = document.getElementById('beatNums');
        for (let i = 0; i < STEPS; i++) {
            const s = document.createElement('span');
            s.textContent = (i % 4 === 0) ? (i / 4 + 1) : '';
            nums.appendChild(s);
        }
    }

    function renderCells() {
        ROWS.forEach(r => {
            for (let i = 0; i < STEPS; i++) {
                cellEls[r.key][i].classList.toggle('on', !!grid[r.key][i]);
            }
        });
    }

    function renderPresets() {
        const wrap = document.getElementById('presets');
        wrap.innerHTML = '';
        PRESETS.forEach((p, idx) => {
            const b = document.createElement('button');
            b.className = 'preset'
                + (idx === currentPreset ? ' active' : '')
                + (idx === cuedPreset ? ' cued' : '');
            b.innerHTML = `<div class="lamp"></div>
                <div class="n">PRESET ${idx + 1}</div>
                <div class="nm">${p.name}</div>
                <div class="cue-txt">cued →</div>`;
            b.addEventListener('click', () => choosePreset(idx));
            wrap.appendChild(b);
        });
    }

    function choosePreset(idx) {
        if (!isPlaying) {
            loadPreset(idx);                 // immediate when stopped
            return;
        }
        if (idx === currentPreset) {         // re-tapping current cancels any cue
            cuedPreset = null;
        } else {
            cuedPreset = idx;                // queue: swaps at end of sequence
        }
        renderPresets();
        document.getElementById('cueNote').textContent =
            cuedPreset !== null ? ` — cued: ${PRESETS[cuedPreset].name}` : '';
    }

    // ---------- transport / scheduler ----------
    let bpm = 120;
    let isPlaying = false;
    let currentStep = 0;
    let nextNoteTime = 0;
    let timerID = null;
    const lookahead = 25;         // ms
    const scheduleAhead = 0.1;    // s

    function secPerStep() { return (60.0 / bpm) / 4; } // 16th notes

    function scheduleStep(step, time) {
        ROWS.forEach(r => {
            if (grid[r.key][step]) trigger(r.key, time);
        });
    }

    function draw(step) {
        // move the playhead highlight
        ROWS.forEach(r => {
            cellEls[r.key].forEach((c, i) => c.classList.toggle('play', i === step));
        });
    }

    function advance() {
        nextNoteTime += secPerStep();
        currentStep++;
        if (currentStep >= STEPS) {
            currentStep = 0;
            // ---- end of sequence: apply a cued preset if one is waiting ----
            if (cuedPreset !== null) {
                loadPreset(cuedPreset);
            }
        }
    }

    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + scheduleAhead) {
            const stepToPlay = currentStep;
            const timeToPlay = nextNoteTime;
            scheduleStep(stepToPlay, timeToPlay);
            // schedule the visual playhead in sync
            const delay = (timeToPlay - audioCtx.currentTime) * 1000;
            setTimeout(() => draw(stepToPlay), Math.max(0, delay));
            advance();
        }
        timerID = setTimeout(scheduler, lookahead);
    }

    async function start() {
        await initAudio();
        isPlaying = true;
        currentStep = 0;
        nextNoteTime = audioCtx.currentTime + 0.06;
        scheduler();
        const btn = document.getElementById('playBtn');
        btn.textContent = '■'; btn.classList.add('playing');
    }

    function stop() {
        isPlaying = false;
        clearTimeout(timerID);
        const btn = document.getElementById('playBtn');
        btn.textContent = '▶'; btn.classList.remove('playing');
        ROWS.forEach(r => cellEls[r.key].forEach(c => c.classList.remove('play')));
        // if a preset was cued, apply it now that we've stopped
        if (cuedPreset !== null) { loadPreset(cuedPreset); }
    }

    // ---------- wire up ----------
    document.getElementById('playBtn').addEventListener('click', () => {
        isPlaying ? stop() : start();
    });
    const bpmSlider = document.getElementById('bpm');
    bpmSlider.addEventListener('input', e => {
        bpm = parseInt(e.target.value);
        document.getElementById('bpmVal').textContent = bpm;
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
        grid = emptyGrid(); renderCells();
        document.getElementById('curName').textContent = 'Blank';
        currentPreset = -1; cuedPreset = null; renderPresets();
        document.getElementById('cueNote').textContent = '';
    });

    // init
    buildGrid();
    loadPreset(0);
</script>
</body>
</html>
