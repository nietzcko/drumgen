<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sixteen — Step Sequencer</title>
<style>
    :root {
        --bg-color:     #1a1a1a;
        --pad-bg:       #2a2a2a;
        --accent:       #e53935;
        --text-color:   #888;
        --step-bg:      #333;
        --step-active:  #e53935;
        --step-current: #fff;
        --panel:        #222;
        --panel-edge:   #333;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background-color: var(--bg-color); }
    body {
        margin: 0; padding: 20px 14px 48px;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .machine {
        max-width: 430px;
        margin: 0 auto;
    }

    /* ---- header ---- */
    .brand {
        display: flex; align-items: baseline; gap: 10px;
        margin-bottom: 20px;
    }
    .brand h1 {
        margin: 0; font-size: 20px; font-weight: 500;
        color: var(--accent); letter-spacing: 1px;
    }
    .brand .sub {
        font-size: 12px; color: #666; font-weight: normal;
    }

    /* ---- transport ---- */
    .transport {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 16px;
    }
    .play-btn {
        background-color: var(--pad-bg);
        color: var(--accent);
        border: 1px solid #444;
        border-radius: 12px;
        width: 60px; height: 48px;
        font-size: 18px; cursor: pointer; font-weight: bold;
        display: grid; place-items: center;
    }
    .play-btn:active { background-color: #444; }
    .play-btn.playing { color: var(--accent); }

    .tempo {
        flex: 1;
        background-color: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        padding: 8px 14px;
    }
    .tempo .top { display: flex; justify-content: space-between; align-items: baseline; }
    .tempo label { font-size: 9px; letter-spacing: 1px; color: #aaa; font-weight: bold; text-transform: uppercase; }
    .tempo .val { font-size: 18px; color: #ccc; font-weight: bold; font-variant-numeric: tabular-nums; }
    .tempo .val small { font-size: 10px; color: #666; font-weight: normal; }
    input[type=range] {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 4px; border-radius: 2px; margin-top: 8px;
        background: #444; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 16px; height: 16px; border-radius: 50%;
        background: var(--accent); cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
        width: 16px; height: 16px; border-radius: 50%;
        background: var(--accent); cursor: pointer; border: none;
    }
    .clear-btn {
        background-color: var(--pad-bg);
        border: 1px solid #444;
        color: var(--text-color);
        border-radius: 12px; padding: 0 16px; height: 48px;
        font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
        font-weight: bold; cursor: pointer;
    }
    .clear-btn:active { background-color: #444; }

    /* ---- presets ---- */
    .presets {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        margin-bottom: 20px;
    }
    .preset {
        position: relative;
        background-color: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 10px; padding: 10px 8px 9px;
        cursor: pointer; text-align: left;
    }
    .preset .n { font-size: 8px; letter-spacing: 1px; color: #666; font-weight: bold; text-transform: uppercase; }
    .preset .nm { font-size: 12px; font-weight: bold; color: #aaa; margin-top: 3px; }
    .preset .lamp {
        position: absolute; top: 9px; right: 9px;
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--step-bg); border: 1px solid #1a1a1a;
    }
    .preset.active { border-color: var(--accent); }
    .preset.active .nm { color: var(--accent); }
    .preset.active .lamp { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .preset.cued .lamp { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink .5s steps(1) infinite; }
    .preset.cued { border-color: #7a2420; }
    @keyframes blink { 50% { opacity: .2; } }
    .preset .cue-txt {
        display: none; font-size: 8px; letter-spacing: 1px; color: var(--accent);
        text-transform: uppercase; margin-top: 5px; font-weight: bold;
    }
    .preset.cued .cue-txt { display: block; }

    /* ---- grid ---- */
    .beatbar { display: flex; align-items: center; margin-bottom: 6px; }
    .beatbar .spacer { width: 62px; flex-shrink: 0; }
    .beatbar .nums { display: flex; flex: 1; }
    .beatbar .nums span {
        flex: 1; margin: 0 1px; text-align: center;
        font-size: 8px; color: #666; font-variant-numeric: tabular-nums;
    }
    .beatbar .nums span:nth-child(4n+1) { color: var(--accent); }

    .grid { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; }
    .row .name {
        width: 62px; flex-shrink: 0;
        font-size: 11px; color: #aaa; text-align: right;
        padding-right: 8px; font-weight: bold;
    }
    .steps { display: flex; flex: 1; }
    .step {
        flex: 1; height: 26px;
        background-color: var(--step-bg);
        border-radius: 3px; margin: 0 1px; min-width: 2px;
        cursor: pointer;
        transition: background-color .1s, opacity .1s;
    }
    .step.on { background-color: var(--step-active); }
    .step.play { background-color: var(--step-current) !important; box-shadow: 0 0 10px #fff; }
    /* faint marker on the downbeat columns */
    .steps .step:nth-child(4n+1):not(.on):not(.play) { background-color: #3c3c3c; }

    .foot {
        margin-top: 20px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 11px; color: #666;
        display: flex; justify-content: space-between; align-items: center;
    }
    .foot .status b { color: var(--accent); }
    .foot .status .cue { color: var(--accent); }

    @media (max-width: 460px) {
        .row .name, .beatbar .spacer { width: 46px; }
        .step { height: 24px; }
    }

    /* ---- panels (setups + midi) ---- */
    .panel {
        margin-top: 16px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        padding: 14px 14px 16px;
    }
    .panel-title {
        font-size: 10px; letter-spacing: 1px; color: #aaa; font-weight: bold;
        text-transform: uppercase; margin-bottom: 12px;
        display: flex; align-items: center; gap: 8px;
    }
    .panel-row { display: flex; gap: 8px; align-items: center; }
    .text-in {
        flex: 1; background: #1a1a1a; border: 1px solid #444;
        color: #ccc; border-radius: 8px; padding: 9px 11px; font-size: 13px;
        outline: none;
    }
    .text-in:focus { border-color: var(--accent); }
    .text-in::placeholder { color: #555; }
    .mini-btn {
        background: var(--pad-bg); border: 1px solid #444; color: var(--text-color);
        border-radius: 8px; padding: 9px 13px; font-size: 11px; font-weight: bold;
        letter-spacing: .5px; cursor: pointer; text-transform: uppercase; white-space: nowrap;
    }
    .mini-btn:active { background: #444; }
    .mini-btn.accent { color: var(--accent); border-color: #5c2a28; }
    .mini-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }

    .setup-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .setup-item {
        display: flex; align-items: center; gap: 8px;
        background: #1e1e1e; border: 1px solid var(--panel-edge);
        border-radius: 8px; padding: 7px 10px;
    }
    .setup-item .snm { flex: 1; font-size: 13px; color: #bbb; cursor: pointer; }
    .setup-item .snm small { color: #666; font-size: 10px; margin-left: 6px; }
    .setup-item .x {
        color: #666; cursor: pointer; font-size: 16px; line-height: 1;
        padding: 0 4px; background: none; border: none;
    }
    .setup-item .x:hover { color: var(--accent); }
    .setup-empty { font-size: 12px; color: #555; padding: 4px 2px; }

    .midi-state {
        font-size: 9px; padding: 2px 7px; border-radius: 10px;
        background: #333; color: #888; letter-spacing: 1px;
    }
    .midi-state.live { background: #1c3a1c; color: #6bd06b; }
    .learn-list { display: flex; flex-direction: column; gap: 6px; }
    .learn-row {
        display: flex; align-items: center; gap: 10px;
        background: #1e1e1e; border: 1px solid var(--panel-edge);
        border-radius: 8px; padding: 8px 10px;
    }
    .learn-row .act { flex: 1; font-size: 13px; color: #bbb; font-weight: bold; }
    .learn-row .bind { font-size: 10px; color: #666; font-family: monospace; min-width: 74px; text-align: right; }
    .learn-row .bind.set { color: #888; }
    .learn-row.listening { border-color: var(--accent); }
    .learn-row.listening .bind { color: var(--accent); }
    .learn-row.flash { border-color: #6bd06b; }
    .midi-hint { font-size: 11px; color: #555; margin-top: 10px; line-height: 1.5; }
    .midi-hint b { color: #888; }

    /* ---- EQ ---- */
    .eq-bank { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 2px; }
    .eq-band { display: grid; grid-template-columns: 44px 1fr 56px; align-items: center; gap: 12px; }
    .eq-lbl { font-size: 11px; letter-spacing: 1px; color: #aaa; text-transform: uppercase; font-weight: bold; }
    .eq-slider {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 4px; border-radius: 2px; outline: none;
        background: linear-gradient(#666 0 0) no-repeat center/2px 12px, #444;
    }
    .eq-slider::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 18px; height: 18px; border-radius: 50%;
        background: var(--accent); cursor: pointer; border: 2px solid #1a1a1a;
    }
    .eq-slider::-moz-range-thumb {
        width: 18px; height: 18px; border-radius: 50%;
        background: var(--accent); cursor: pointer; border: 2px solid #1a1a1a;
    }
    .eq-val { font-size: 12px; color: #aaa; font-variant-numeric: tabular-nums; font-weight: bold; text-align: right; }
</style>
</head>
<body>
<div class="machine">
    <div class="brand">
        <h1>Sixteen</h1>
        <span class="sub">Step Sequencer <span class="version" style="font-size:12px;color:#666;">v1</span></span>
    </div>

    <div class="transport">
        <button class="play-btn" id="playBtn" title="Play / Stop">▶</button>
        <div class="tempo">
            <div class="top">
                <label>Tempo</label>
                <span class="val"><span id="bpmVal">120</span> <small>BPM</small></span>
            </div>
            <input type="range" id="bpm" min="60" max="220" value="120">
        </div>
        <button class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <div class="presets" id="presets"></div>

    <div class="beatbar">
        <div class="spacer"></div>
        <div class="nums" id="beatNums"></div>
    </div>
    <div class="grid" id="grid"></div>

    <div class="foot">
        <div class="status">Preset <b id="curName">—</b><span class="cue" id="cueNote"></span>
            <a id="resetPresets" style="color:#666; cursor:pointer; text-decoration:underline; margin-left:10px;">reset presets</a>
        </div>
        <div id="wavNote">samples: checking…</div>
    </div>

    <!-- ---- Setups: save / load / export / import ---- -->
    <div class="panel" id="setupsPanel">
        <div class="panel-title">Setups</div>
        <div class="panel-row">
            <input type="text" id="setupName" class="text-in" placeholder="Name this setup" maxlength="24">
            <button class="mini-btn accent" id="saveSetup">Save</button>
        </div>
        <div class="setup-list" id="setupList"></div>
        <div class="panel-row" style="margin-top:10px;">
            <button class="mini-btn" id="exportSetups">Export file</button>
            <button class="mini-btn" id="importBtn">Import file</button>
            <input type="file" id="importFile" accept="application/json" style="display:none;">
        </div>
    </div>

    <!-- ---- MIDI: learn a foot controller ---- -->
    <div class="panel" id="midiPanel">
        <div class="panel-title">MIDI Foot Control <span id="midiState" class="midi-state">off</span></div>
        <button class="mini-btn" id="midiEnable" style="width:100%; margin-bottom:10px;">Enable MIDI</button>
        <div class="learn-list" id="learnList"></div>
        <div class="midi-hint">Tap <b>Learn</b>, then press the pedal you want to assign. Presets cue and switch at the end of the sequence, same as tapping them.</div>
    </div>

    <!-- ---- 3-band master EQ ---- -->
    <div class="panel" id="eqPanel">
        <div class="panel-title">EQ <button class="mini-btn" id="eqReset" style="margin-left:auto; padding:4px 10px;">Reset</button></div>
        <div class="eq-bank">
            <div class="eq-band">
                <div class="eq-lbl">Low</div>
                <input type="range" class="eq-slider" id="eqLow"  min="-12" max="12" step="1" value="0">
                <div class="eq-val" id="eqLowVal">0 dB</div>
            </div>
            <div class="eq-band">
                <div class="eq-lbl">Mid</div>
                <input type="range" class="eq-slider" id="eqMid"  min="-12" max="12" step="1" value="0">
                <div class="eq-val" id="eqMidVal">0 dB</div>
            </div>
            <div class="eq-band">
                <div class="eq-lbl">High</div>
                <input type="range" class="eq-slider" id="eqHigh" min="-12" max="12" step="1" value="0">
                <div class="eq-val" id="eqHighVal">0 dB</div>
            </div>
        </div>
    </div>
</div>

<script>
/* ============================================================
   Sixteen — a 16-step drum sequencer.
   Uses the same samples as the groove generator:
   kick.wav, snare.wav, snare_ghost.wav, hihat_closed.wav,
   hihat_open.wav, crash.wav  (synth fallback if missing).
   Four presets; selecting a new one while playing CUES it and
   the switch happens when the current 16-step sequence loops.
   ============================================================ */

    const STEPS = 16;

    // Instrument rows, top → bottom. `key` maps to the sample/synth voice.
    const ROWS = [
        { key: 'crash',        name: 'Crash' },
        { key: 'hihat_open',   name: 'Open HH' },
        { key: 'hihat_closed', name: 'Closed HH' },
        { key: 'snare',        name: 'Snare' },
        { key: 'snare_ghost',  name: 'Ghost' },
        { key: 'kick',         name: 'Kick' },
    ];

    // ---- Four presets. Each is { name, pattern: { rowKey: [16 bits] } } ----
    // 1 = hit. Rows omitted default to empty.
    const P = (s) => s.split('').map(c => c === 'x' ? 1 : 0);
    const PRESETS = [
        {
            name: 'Four/Floor',
            pattern: {
                kick:         P('x...x...x...x...'),
                snare:        P('....x.......x...'),
                hihat_closed: P('x.x.x.x.x.x.x.x.'),
                hihat_open:   P('..x...x...x...x.'),
                crash:        P('x...............'),
            }
        },
        {
            name: 'Backbeat',
            pattern: {
                kick:         P('x.....x.x.......'),
                snare:        P('....x.......x...'),
                snare_ghost:  P('..x...x...x...x.'),
                hihat_closed: P('x.x.x.x.x.x.x.x.'),
            }
        },
        {
            name: 'Half-Time',
            pattern: {
                kick:         P('x.......x.x.....'),
                snare:        P('........x.......'),
                hihat_closed: P('x...x...x...x...'),
                crash:        P('x.......x.......'),
            }
        },
        {
            name: 'D-Beat',
            pattern: {
                kick:         P('x...x...x...x...'),
                snare:        P('..x...x...x...x.'),
                hihat_closed: P('x.x.x.x.x.x.x.x.'),
                crash:        P('x...............'),
            }
        },
    ];

    // ---------- audio (same loading + fallback as the groove app) ----------
    let audioCtx;
    const wavBuffers = {};
    const wavFiles = {
        kick: 'kick.wav', snare: 'snare.wav', snare_ghost: 'snare_ghost.wav',
        hihat_closed: 'hihat_closed.wav', hihat_open: 'hihat_open.wav', crash: 'crash.wav',
    };

    async function loadWavBuffers() {
        let loaded = 0;
        for (const [key, file] of Object.entries(wavFiles)) {
            try {
                const res = await fetch(file);
                if (!res.ok) continue;
                const buf = await res.arrayBuffer();
                wavBuffers[key] = await audioCtx.decodeAudioData(buf);
                loaded++;
            } catch (e) { /* fall back to synth */ }
        }
        const note = document.getElementById('wavNote');
        note.textContent = loaded > 0
            ? `samples: ${loaded}/6 loaded`
            : 'samples: none found — using synth';
    }

    // ---- master EQ: 3-band (low shelf / mid peak / high shelf) → destination ----
    let eqLow, eqMid, eqHigh, masterBus;
    function buildEq() {
        eqLow = audioCtx.createBiquadFilter();
        eqLow.type = 'lowshelf';   eqLow.frequency.value = 120;
        eqMid = audioCtx.createBiquadFilter();
        eqMid.type = 'peaking';    eqMid.frequency.value = 1000; eqMid.Q.value = 0.9;
        eqHigh = audioCtx.createBiquadFilter();
        eqHigh.type = 'highshelf'; eqHigh.frequency.value = 6000;
        // voices connect to eqLow; chain: low → mid → high → destination
        eqLow.connect(eqMid); eqMid.connect(eqHigh); eqHigh.connect(audioCtx.destination);
        masterBus = eqLow;
        applyEq();
    }
    // eqGains in dB, -12..+12
    const eqGains = { low: 0, mid: 0, high: 0 };
    function applyEq() {
        if (!eqLow) return;
        eqLow.gain.value  = eqGains.low;
        eqMid.gain.value  = eqGains.mid;
        eqHigh.gain.value = eqGains.high;
    }

    async function initAudio() {
        if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
            buildEq();
            await loadWavBuffers();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // route target for all voices (falls back to destination before EQ is built)
    function out() { return masterBus || audioCtx.destination; }

    // active scheduled sources (so Stop can cut sound that's already queued ahead)
    let activeSources = [];
    function trackSource(node) {
        activeSources.push(node);
        node.onended = () => {
            const i = activeSources.indexOf(node);
            if (i >= 0) activeSources.splice(i, 1);
        };
    }
    function killAllSources() {
        activeSources.forEach(n => { try { n.stop(); } catch (e) {} });
        activeSources = [];
    }

    function playWav(key, vol, time) {
        if (!wavBuffers[key]) return false;
        const src = audioCtx.createBufferSource();
        src.buffer = wavBuffers[key];
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(Math.min(1, vol), time);
        src.connect(g); g.connect(out());
        src.start(time);
        trackSource(src);
        return true;
    }

    // Synth fallback voices (mirrors the groove app so it sounds the same w/o wavs)
    function playSynth(key, vol, time) {
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(vol, time);
        g.connect(out());
        if (key === 'kick') {
            const o = audioCtx.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(250, time);
            o.frequency.exponentialRampToValueAtTime(0.001, time + 0.2);
            g.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
            o.connect(g); o.start(time); o.stop(time + 0.2);
            trackSource(o);
        } else if (key === 'snare' || key === 'snare_ghost') {
            const o = audioCtx.createOscillator();
            o.type = 'triangle'; o.frequency.setValueAtTime(200, time);
            const noise = audioCtx.createBufferSource();
            const b = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.25, audioCtx.sampleRate);
            const d = b.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            noise.buffer = b;
            const f = audioCtx.createBiquadFilter();
            f.type = 'highpass'; f.frequency.value = 1000;
            noise.connect(f); f.connect(g); o.connect(g);
            g.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
            o.start(time); noise.start(time); o.stop(time + 0.25);
            trackSource(o); trackSource(noise);
        } else {
            // cymbals / hats
            const isCrash = key === 'crash';
            const isOpen = key === 'hihat_open';
            const dur = isCrash ? 1.5 : (isOpen ? 0.4 : 0.08);
            const noise = audioCtx.createBufferSource();
            const b = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
            const d = b.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            noise.buffer = b;
            const f = audioCtx.createBiquadFilter();
            f.type = 'highpass'; f.frequency.value = isCrash ? 4000 : (isOpen ? 5000 : 7000);
            noise.connect(f); f.connect(g);
            g.gain.exponentialRampToValueAtTime(0.001, time + dur);
            noise.start(time);
            trackSource(noise);
        }
    }

    function trigger(key, time) {
        const vol = key === 'snare_ghost' ? 0.32 : 0.9;
        if (!playWav(key, vol, time)) playSynth(key, vol, time);
    }

    // ---------- pattern state ----------
    // live grid: { rowKey: [16] }
    let grid = {};
    function emptyGrid() {
        const g = {};
        ROWS.forEach(r => g[r.key] = new Array(STEPS).fill(0));
        return g;
    }

    // Per-preset WORKING grids. These hold your edits so switching presets and
    // coming back keeps what you changed. Seeded from the factory PRESETS, then
    // persisted to localStorage so they survive a reload.
    const PGRID_KEY = 'sixteen_presetgrids_v1';
    function presetToGrid(idx) {
        const g = emptyGrid();
        const pat = PRESETS[idx].pattern;
        for (const key in pat) if (g[key]) g[key] = pat[key].slice();
        return g;
    }
    let presetGrids = null;
    function loadPresetGrids() {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(PGRID_KEY)); } catch (e) {}
        presetGrids = PRESETS.map((_, idx) => {
            // validate a saved grid has all rows at length 16, else fall back to factory
            const s = saved && saved[idx];
            if (s && ROWS.every(r => Array.isArray(s[r.key]) && s[r.key].length === STEPS)) {
                const g = emptyGrid();
                ROWS.forEach(r => g[r.key] = s[r.key].slice());
                return g;
            }
            return presetToGrid(idx);
        });
    }
    function savePresetGrids() {
        try { localStorage.setItem(PGRID_KEY, JSON.stringify(presetGrids)); } catch (e) {}
    }

    function loadPreset(idx) {
        if (!presetGrids) loadPresetGrids();
        // point the live grid at this preset's working copy (edits write through)
        grid = presetGrids[idx];
        currentPreset = idx;
        cuedPreset = null;
        renderCells();
        renderPresets();
        document.getElementById('curName').textContent = PRESETS[idx].name;
        document.getElementById('cueNote').textContent = '';
    }

    let currentPreset = 0;
    let cuedPreset = null;   // set when a new preset is chosen mid-play

    // ---------- build DOM ----------
    const gridEl = document.getElementById('grid');
    const cellEls = {}; // rowKey -> [16 elements]

    function buildGrid() {
        ROWS.forEach(r => {
            const row = document.createElement('div');
            row.className = 'row';
            const name = document.createElement('div');
            name.className = 'name'; name.textContent = r.name;
            const steps = document.createElement('div');
            steps.className = 'steps';
            cellEls[r.key] = [];
            for (let i = 0; i < STEPS; i++) {
                const c = document.createElement('div');
                c.className = 'step';
                c.addEventListener('click', () => {
                    grid[r.key][i] = grid[r.key][i] ? 0 : 1;
                    c.classList.toggle('on', !!grid[r.key][i]);
                    // if we're editing a preset (not a loaded setup / blank), persist it
                    if (presetGrids && currentPreset >= 0 && grid === presetGrids[currentPreset]) {
                        savePresetGrids();
                    }
                });
                steps.appendChild(c);
                cellEls[r.key].push(c);
            }
            row.appendChild(name); row.appendChild(steps);
            gridEl.appendChild(row);
        });
        // beat numbers
        const nums = document.getElementById('beatNums');
        for (let i = 0; i < STEPS; i++) {
            const s = document.createElement('span');
            s.textContent = (i % 4 === 0) ? (i / 4 + 1) : '';
            nums.appendChild(s);
        }
    }

    function renderCells() {
        ROWS.forEach(r => {
            for (let i = 0; i < STEPS; i++) {
                cellEls[r.key][i].classList.toggle('on', !!grid[r.key][i]);
            }
        });
    }

    function renderPresets() {
        const wrap = document.getElementById('presets');
        wrap.innerHTML = '';
        PRESETS.forEach((p, idx) => {
            const b = document.createElement('button');
            b.className = 'preset'
                + (idx === currentPreset ? ' active' : '')
                + (idx === cuedPreset ? ' cued' : '');
            b.innerHTML = `<div class="lamp"></div>
                <div class="n">PRESET ${idx + 1}</div>
                <div class="nm">${p.name}</div>
                <div class="cue-txt">cued →</div>`;
            b.addEventListener('click', () => choosePreset(idx));
            wrap.appendChild(b);
        });
    }

    function choosePreset(idx) {
        if (!isPlaying) {
            loadPreset(idx);                 // immediate when stopped
            return;
        }
        if (idx === currentPreset) {         // re-tapping current cancels any cue
            cuedPreset = null;
        } else {
            cuedPreset = idx;                // queue: swaps at end of sequence
        }
        renderPresets();
        document.getElementById('cueNote').textContent =
            cuedPreset !== null ? ` — cued: ${PRESETS[cuedPreset].name}` : '';
    }

    // ---------- transport / scheduler ----------
    let bpm = 120;
    let isPlaying = false;
    let currentStep = 0;
    let nextNoteTime = 0;
    let timerID = null;
    const lookahead = 25;         // ms
    const scheduleAhead = 0.1;    // s

    function secPerStep() { return (60.0 / bpm) / 4; } // 16th notes

    function scheduleStep(step, time) {
        ROWS.forEach(r => {
            if (grid[r.key][step]) trigger(r.key, time);
        });
    }

    function draw(step) {
        // move the playhead highlight
        ROWS.forEach(r => {
            cellEls[r.key].forEach((c, i) => c.classList.toggle('play', i === step));
        });
    }

    function advance() {
        nextNoteTime += secPerStep();
        currentStep++;
        if (currentStep >= STEPS) {
            currentStep = 0;
            // ---- end of sequence: apply a cued preset if one is waiting ----
            if (cuedPreset !== null) {
                loadPreset(cuedPreset);
            }
        }
    }

    function scheduler() {
        if (!isPlaying) return;   // don't reschedule if we've stopped
        while (nextNoteTime < audioCtx.currentTime + scheduleAhead) {
            const stepToPlay = currentStep;
            const timeToPlay = nextNoteTime;
            scheduleStep(stepToPlay, timeToPlay);
            // schedule the visual playhead in sync (guarded so a late timeout after
            // stop doesn't re-light the grid)
            const delay = (timeToPlay - audioCtx.currentTime) * 1000;
            setTimeout(() => { if (isPlaying) draw(stepToPlay); }, Math.max(0, delay));
            advance();
        }
        timerID = setTimeout(scheduler, lookahead);
    }

    async function start() {
        await initAudio();
        isPlaying = true;
        currentStep = 0;
        nextNoteTime = audioCtx.currentTime + 0.06;
        scheduler();
        const btn = document.getElementById('playBtn');
        btn.textContent = '■'; btn.classList.add('playing');
    }

    function stop() {
        isPlaying = false;              // must be set first so scheduler bails out
        clearTimeout(timerID);
        timerID = null;
        killAllSources();               // cut any audio already scheduled ahead
        const btn = document.getElementById('playBtn');
        btn.textContent = '▶'; btn.classList.remove('playing');
        ROWS.forEach(r => cellEls[r.key].forEach(c => c.classList.remove('play')));
        // if a preset was cued, apply it now that we've stopped
        if (cuedPreset !== null) { loadPreset(cuedPreset); }
    }

    // ---------- wire up ----------
    function togglePlay() { isPlaying ? stop() : start(); }
    document.getElementById('playBtn').addEventListener('click', togglePlay);
    const bpmSlider = document.getElementById('bpm');
    bpmSlider.addEventListener('input', e => {
        bpm = parseInt(e.target.value);
        document.getElementById('bpmVal').textContent = bpm;
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
        grid = emptyGrid(); renderCells();
        document.getElementById('curName').textContent = 'Blank';
        currentPreset = -1; cuedPreset = null; renderPresets();
        document.getElementById('cueNote').textContent = '';
    });

    // Unified actions that both the UI and a foot controller can fire.
    // Presets go through choosePreset() so they CUE while playing (swap at loop end).
    const ACTIONS = [
        { id: 'play',    label: 'Play / Stop', run: togglePlay },
        { id: 'preset0', label: 'Preset 1',    run: () => choosePreset(0) },
        { id: 'preset1', label: 'Preset 2',    run: () => choosePreset(1) },
        { id: 'preset2', label: 'Preset 3',    run: () => choosePreset(2) },
        { id: 'preset3', label: 'Preset 4',    run: () => choosePreset(3) },
    ];
    function runAction(id) {
        const a = ACTIONS.find(x => x.id === id);
        if (a) a.run();
    }

    /* ================= SETUPS: save / load / export / import ================= */
    const SETUP_KEY = 'sixteen_setups_v1';

    function readSetups() {
        try { return JSON.parse(localStorage.getItem(SETUP_KEY)) || []; }
        catch (e) { return []; }
    }
    function writeSetups(list) {
        try { localStorage.setItem(SETUP_KEY, JSON.stringify(list)); } catch (e) {}
    }
    function snapshot() {
        // full state of a setup
        const pat = {};
        ROWS.forEach(r => pat[r.key] = grid[r.key].slice());
        return { name: '', bpm, pattern: pat, eq: { ...eqGains } };
    }
    function applySetup(s) {
        grid = emptyGrid();
        for (const key in s.pattern) if (grid[key]) grid[key] = s.pattern[key].slice();
        if (s.bpm) {
            bpm = s.bpm;
            bpmSlider.value = bpm;
            document.getElementById('bpmVal').textContent = bpm;
        }
        currentPreset = -1; cuedPreset = null;
        renderCells(); renderPresets();
        // restore EQ if the setup carries it
        if (s.eq) {
            ['low','mid','high'].forEach(band => {
                const db = s.eq[band] || 0;
                const el = document.getElementById('eq' + cap(band));
                if (el) el.value = db;
                if (audioCtx) setEq(band, db); else eqGains[band] = db;
                document.getElementById('eq' + cap(band) + 'Val').textContent = (db > 0 ? '+' : '') + db + ' dB';
            });
        }
        document.getElementById('curName').textContent = s.name || 'Setup';
        document.getElementById('cueNote').textContent = '';
    }
    function renderSetups() {
        const list = document.getElementById('setupList');
        const setups = readSetups();
        if (!setups.length) {
            list.innerHTML = '<div class="setup-empty">No saved setups yet.</div>';
            return;
        }
        list.innerHTML = '';
        setups.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = 'setup-item';
            row.innerHTML = `<span class="snm">${escapeHtml(s.name)}<small>${s.bpm || bpm} BPM</small></span>
                             <button class="x" title="Delete">×</button>`;
            row.querySelector('.snm').addEventListener('click', () => applySetup(s));
            row.querySelector('.x').addEventListener('click', () => {
                const arr = readSetups(); arr.splice(i, 1); writeSetups(arr); renderSetups();
            });
            list.appendChild(row);
        });
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    document.getElementById('saveSetup').addEventListener('click', () => {
        const input = document.getElementById('setupName');
        const name = (input.value || '').trim() || `Setup ${readSetups().length + 1}`;
        const s = snapshot(); s.name = name;
        const arr = readSetups();
        const existing = arr.findIndex(x => x.name === name);
        if (existing >= 0) arr[existing] = s; else arr.push(s);
        writeSetups(arr); renderSetups();
        input.value = '';
        document.getElementById('curName').textContent = name;
    });

    document.getElementById('exportSetups').addEventListener('click', () => {
        const data = JSON.stringify({ app: 'sixteen', setups: readSetups() }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'sixteen-setups.json';
        a.click(); URL.revokeObjectURL(url);
    });
    document.getElementById('importBtn').addEventListener('click', () =>
        document.getElementById('importFile').click());
    document.getElementById('importFile').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const parsed = JSON.parse(reader.result);
                const incoming = Array.isArray(parsed) ? parsed : parsed.setups;
                if (!Array.isArray(incoming)) throw new Error('bad format');
                const arr = readSetups();
                incoming.forEach(s => {
                    if (s && s.pattern) {
                        const idx = arr.findIndex(x => x.name === s.name);
                        if (idx >= 0) arr[idx] = s; else arr.push(s);
                    }
                });
                writeSetups(arr); renderSetups();
            } catch (err) {
                alert('That file could not be read as Sixteen setups.');
            }
            e.target.value = '';
        };
        reader.readAsText(file);
    });

    /* ================= MIDI: learn a foot controller ================= */
    // bindings: actionId -> { type:'note'|'cc', data1, channel }  (channel ignored on match)
    const MIDI_KEY = 'sixteen_midi_v1';
    let midiBindings = {};
    let midiLearning = null;   // actionId currently listening
    let midiAccess = null;

    function readBindings() {
        try { return JSON.parse(localStorage.getItem(MIDI_KEY)) || {}; }
        catch (e) { return {}; }
    }
    function writeBindings() {
        try { localStorage.setItem(MIDI_KEY, JSON.stringify(midiBindings)); } catch (e) {}
    }
    function bindLabel(b) {
        if (!b) return 'unassigned';
        return b.type === 'note' ? `Note ${b.data1}` : `CC ${b.data1}`;
    }

    function renderLearn() {
        const list = document.getElementById('learnList');
        list.innerHTML = '';
        ACTIONS.forEach(a => {
            const row = document.createElement('div');
            row.className = 'learn-row' + (midiLearning === a.id ? ' listening' : '');
            row.id = 'learn_' + a.id;
            const b = midiBindings[a.id];
            row.innerHTML = `<span class="act">${a.label}</span>
                <span class="bind ${b ? 'set' : ''}">${midiLearning === a.id ? 'press pedal…' : bindLabel(b)}</span>
                <button class="mini-btn ${midiLearning === a.id ? 'on' : ''}">${midiLearning === a.id ? 'Cancel' : 'Learn'}</button>`;
            row.querySelector('button').addEventListener('click', () => {
                midiLearning = (midiLearning === a.id) ? null : a.id;
                renderLearn();
            });
            list.appendChild(row);
        });
    }

    function handleMidi(msg) {
        const [status, data1, data2] = msg.data;
        const cmd = status & 0xf0;
        // note-on with velocity>0, or CC with value>0 (pedal press)
        let ev = null;
        if (cmd === 0x90 && data2 > 0) ev = { type: 'note', data1 };
        else if (cmd === 0xb0 && data2 > 0) ev = { type: 'cc', data1 };
        if (!ev) return;

        if (midiLearning) {
            midiBindings[midiLearning] = ev;
            const learned = midiLearning;
            midiLearning = null;
            writeBindings();
            renderLearn();
            const row = document.getElementById('learn_' + learned);
            if (row) { row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 400); }
            return;
        }
        // match against bindings
        for (const actionId in midiBindings) {
            const b = midiBindings[actionId];
            if (b.type === ev.type && b.data1 === ev.data1) {
                runAction(actionId);
                break;
            }
        }
    }

    async function enableMidi() {
        const stateEl = document.getElementById('midiState');
        if (!navigator.requestMIDIAccess) {
            stateEl.textContent = 'unsupported';
            alert('Web MIDI is not available in this browser. Try Chrome, Edge, or Opera.');
            return;
        }
        try {
            midiAccess = await navigator.requestMIDIAccess({ sysex: false });
            const attach = () => {
                let count = 0;
                midiAccess.inputs.forEach(inp => { inp.onmidimessage = handleMidi; count++; });
                stateEl.textContent = count ? `${count} device${count > 1 ? 's' : ''}` : 'no devices';
                stateEl.classList.toggle('live', count > 0);
            };
            attach();
            midiAccess.onstatechange = attach;  // re-attach when a pedal is plugged in
            document.getElementById('midiEnable').textContent = 'MIDI Enabled';
            document.getElementById('midiEnable').classList.add('on');
        } catch (e) {
            stateEl.textContent = 'blocked';
            alert('MIDI access was blocked. Check the browser permission and try again.');
        }
    }
    document.getElementById('midiEnable').addEventListener('click', enableMidi);

    /* ================= EQ ================= */
    function setEq(band, db) {
        eqGains[band] = db;
        applyEq();
        document.getElementById('eq' + cap(band) + 'Val').textContent = (db > 0 ? '+' : '') + db + ' dB';
    }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    [['eqLow','low'],['eqMid','mid'],['eqHigh','high']].forEach(([id, band]) => {
        document.getElementById(id).addEventListener('input', async e => {
            await initAudio();   // ensure the graph exists so changes are audible immediately
            setEq(band, parseInt(e.target.value));
        });
    });
    document.getElementById('eqReset').addEventListener('click', () => {
        ['low','mid','high'].forEach(band => {
            setEq(band, 0);
            document.getElementById('eq' + cap(band)).value = 0;
        });
    });

    // init
    buildGrid();
    loadPresetGrids();
    loadPreset(0);
    midiBindings = readBindings();
    renderSetups();
    renderLearn();

    // reset all four presets back to their factory patterns
    document.getElementById('resetPresets').addEventListener('click', () => {
        if (!confirm('Reset all four presets to their original patterns? Your edits to them will be lost.')) return;
        presetGrids = PRESETS.map((_, idx) => presetToGrid(idx));
        savePresetGrids();
        loadPreset(currentPreset >= 0 ? currentPreset : 0);
    });
</script>
</body>
</html>
